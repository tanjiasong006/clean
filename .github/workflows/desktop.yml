name: Desktop checks

on:
  push:
    tags: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tooling
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check formatting
        run: |
          cargo fmt --check
          rustfmt --edition 2024 --check scripts/core_perf.rs
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Core performance smoke
        run: |
          rustc --edition=2024 -D warnings -O scripts/core_perf.rs -o "$RUNNER_TEMP/clean-core-perf"
          "$RUNNER_TEMP/clean-core-perf"
      - name: Build
        run: cargo build --locked
      - name: Build release
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo build --locked --release
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          packaging/macos/package.sh "${GITHUB_REF_NAME#v}" target/release/clean dist
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Clean-${{ github.ref_name }}-macos-${{ runner.arch }}
          path: dist/Clean-*-macos-*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tooling
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check formatting
        run: |
          cargo fmt --check
          rustfmt --edition 2024 --check scripts/core_perf.rs
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Core performance smoke
        run: |
          rustc --edition=2024 -D warnings -O scripts/core_perf.rs -o "$env:RUNNER_TEMP/clean-core-perf.exe"
          & "$env:RUNNER_TEMP/clean-core-perf.exe"
      - name: Build
        run: |
          cargo build --locked
          cargo build --locked --release
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }
          ./packaging/windows/package.ps1 -Version ("${{ github.ref_name }}" -replace '^v', '')
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Clean-${{ github.ref_name }}-windows-x86_64-setup
          path: dist/Clean-*-windows-x86_64-setup.exe
          if-no-files-found: error

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(release-assets/*/*.dmg release-assets/*/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installer artifacts found" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Clean ${TAG#v}" \
              --generate-notes
          fi
