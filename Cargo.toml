[package]
name = "clean"
version = "0.1.0"
edition = "2024"
publish = false
description = "A macOS-first disk space analyzer built with GPUI Kit"

[dependencies]
gpui-kit = "=0.8.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[build-dependencies]
embed-resource = "3.0.12"
